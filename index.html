<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ACT-Pause</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; min-height: 100vh;
    background: linear-gradient(135deg, #2c3e50, #4a6785);
    font-family: -apple-system, sans-serif;
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  h1 { font-size: 1.3em; opacity: 0.8; margin-bottom: 20px; font-weight: 300; }
  #satz {
    font-size: 1.5em; line-height: 1.5; margin: 20px 0 20px;
    min-height: 120px; display: flex; align-items: center;
    justify-content: center; padding: 0 10px;
  }
  .btn {
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    padding: 16px 32px; font-size: 1.1em; border-radius: 30px;
    margin: 8px; cursor: pointer; backdrop-filter: blur(10px);
  }
  .btn:active { background: rgba(255,255,255,0.3); }
  .btn-small { font-size: 0.9em; padding: 10px 20px; opacity: 0.7; }
  #haupt-screen, #atem-screen { width: 100%; max-width: 500px; }
  #atem-screen { display: none; }

  /* Denkzeit-Kreis */
  #denkzeit-wrap { display: none; margin: 10px auto 20px; }
  #denkzeit-svg { transform: rotate(-90deg); }
  #denkzeit-kreis-bg { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 6; }
  #denkzeit-kreis-fg {
    fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 314; stroke-dashoffset: 0;
  }
  #denkzeit-text {
    position: relative; margin-top: -95px; font-size: 1.4em; opacity: 0.9;
  }

  #kreis {
    width: 150px; height: 150px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    margin: 30px auto; display: flex; align-items: center;
    justify-content: center; font-size: 3em; transition: transform 4s ease-in-out;
  }
  .ein { transform: scale(1.3); }
  #zaehltext { font-size: 1.1em; opacity: 0.8; margin-top: 20px; min-height: 60px; }
  .nav { position: fixed; bottom: 20px; display: flex; gap: 10px; }
</style>
</head>
<body>

<div id="haupt-screen">
  <h1>Ein Moment für dich</h1>
  <div id="satz">Tippe auf „Neuer Satz“</div>

  <div id="denkzeit-wrap">
    <svg id="denkzeit-svg" width="100" height="100" viewBox="0 0 100 100">
      <circle id="denkzeit-kreis-bg" cx="50" cy="50" r="50"></circle>
      <circle id="denkzeit-kreis-fg" cx="50" cy="50" r="50"></circle>
    </svg>
    <div id="denkzeit-text">60</div>
  </div>

  <div>
    <button class="btn" onclick="neuerSatz()">Neuer Satz</button>
    <button class="btn" onclick="starteDenkzeit()">60 Sek. Denkzeit</button>
  </div>
</div>

<div id="atem-screen">
  <h1>Atembeobachtung</h1>
  <div id="kreis">0</div>
  <div id="zaehltext">Bereit? Tippe auf Start.</div>
  <button class="btn" id="atemBtn" onclick="startAtem()">Start</button>
</div>

<div class="nav">
  <button class="btn btn-small" onclick="zeigeHaupt()">Sätze</button>
  <button class="btn btn-small" onclick="zeigeAtem()">Atmen (10x)</button>
</div>

<script>
const saetze = [
  // Ausgangs-Set (ACT-Grundlagen)
  "Akzeptiere Gedanken und Gefühle und verbinde dich mit dem Moment.",
  "Comeback zu meinen Werten.",
  "Trete in effektive Aktion.",
  "Kann ich mich anderswo, z.B. in der Schule, zu Hause fühlen? Sicher fühlen?",
  "Was würde mein nichtängstliches Ich machen?",
  "Langsamer machen. Unerhört langsam. Lächerlich langsam.",
  "Ich habe den Gedanken, dass …",
  "Vielen Dank, lieber Verstand. Wie aufschlussreich!",
  "Die Grundfrage ist nicht, ob ein Gedanke richtig ist, sondern ob er hilfreich ist.",
  "Es sind einfach Wörter, die mein Gehirn generiert.",
  "Werde ich in diesem Moment das Süße wie auch das Bittere akzeptieren?",
  "Werde ich Geschichten vom Möglichen leichtnehmen?",
  "Werde ich Autor oder Autorin meines eigenen Lebens sein?",
  "Kehre ich, wenn ich abschweife, freundlich lächelnd zurück?",
  "Fünf Dinge wahrnehmen: Gegenstände, Klänge, Körperoberfläche.",
  "Verbinde dich ganz mit deiner Morgenroutine.",
  "Wenn Gedanken abschweifen: innerlich „denken“ sagen und zurückkehren.",
  "Verbindung mit der Tätigkeit — auch wenn sie unangenehm ist, aber meinen Werten entspricht.",

  // Neu ergänzte Sätze
  "Ich stelle mir den Gedanken auf einem entfernten Bildschirm vor — klein, schwarz-weiß.",
  "Ich gebe der Geschichte einen Titel: die „keiner mag mich“-Geschichte.",
  "Ich spreche den Gedanken mit einer lächerlichen Stimme.",
  "Ich stelle mir vor, wie der Gedanke gesungen wird.",
  "Ich beobachte meinen Verstand, ohne mit ihm zu verschmelzen.",
  "Ich drucke den Gedanken gedanklich auf ein T-Shirt.",
  "Ich gebe der Vorstellung einen ironischen Soundtrack."
];

let letzterSatz = -1;

function neuerSatz() {
  let index;
  do {
    index = Math.floor(Math.random() * saetze.length);
  } while (index === letzterSatz && saetze.length > 1);
  letzterSatz = index;
  document.getElementById('satz').textContent = saetze[index];
  stoppeDenkzeit();
}

// Denkzeit (60 Sek. Kreis-Countdown)
let denkzeitInterval = null;
const DENKZEIT_DAUER = 60;
const UMFANG = 2 * Math.PI * 50; // ~314

function starteDenkzeit() {
  const satzText = document.getElementById('satz').textContent;
  if (!satzText || satzText === 'Tippe auf „Neuer Satz“') {
    neuerSatz();
  }
  stoppeDenkzeit();

  const wrap = document.getElementById('denkzeit-wrap');
  const fg = document.getElementById('denkzeit-kreis-fg');
  const text = document.getElementById('denkzeit-text');

  wrap.style.display = 'block';
  fg.style.strokeDasharray = UMFANG;
  fg.style.stroke = '#fff';

  let verbleibend = DENKZEIT_DAUER;
  text.textContent = verbleibend;
  fg.style.transition = 'none';
  fg.style.strokeDashoffset = 0;

  // Reflow erzwingen, damit die Transition greift
  void fg.offsetWidth;

  fg.style.transition = `stroke-dashoffset ${DENKZEIT_DAUER}s linear`;
  fg.style.strokeDashoffset = UMFANG;

  denkzeitInterval = setInterval(() => {
    verbleibend--;
    text.textContent = verbleibend > 0 ? verbleibend : '✓';
    if (verbleibend <= 0) {
      clearInterval(denkzeitInterval);
      denkzeitInterval = null;
    }
  }, 1000);
}

function stoppeDenkzeit() {
  if (denkzeitInterval) {
    clearInterval(denkzeitInterval);
    denkzeitInterval = null;
  }
  const wrap = document.getElementById('denkzeit-wrap');
  const fg = document.getElementById('denkzeit-kreis-fg');
  wrap.style.display = 'none';
  fg.style.transition = 'none';
  fg.style.strokeDashoffset = 0;
}

// Navigation
function zeigeHaupt() {
  document.getElementById('haupt-screen').style.display = 'block';
  document.getElementById('atem-screen').style.display = 'none';
}
function zeigeAtem() {
  document.getElementById('haupt-screen').style.display = 'none';
  document.getElementById('atem-screen').style.display = 'block';
  resetAtem();
}

// Atembeobachtung (10 Atemzüge)
let atemZaehler = 0;
let atemLaeuft = false;

function resetAtem() {
  atemLaeuft = false;
  atemZaehler = 0;
  document.getElementById('kreis').textContent = '0';
  document.getElementById('kreis').classList.remove('ein');
  document.getElementById('zaehltext').textContent = 'Bereit? Tippe auf Start.';
  document.getElementById('atemBtn').style.display = 'inline-block';
  document.getElementById('atemBtn').textContent = 'Start';
  document.getElementById('atemBtn').onclick = startAtem;
}

function startAtem() {
  if (atemLaeuft) return;
  atemLaeuft = true;
  atemZaehler = 0;
  document.getElementById('atemBtn').style.display = 'none';
  atemZyklus();
}

function atemZyklus() {
  if (atemZaehler >= 10) {
    document.getElementById('zaehltext').textContent = 'Gut gemacht. Zehn Atemzüge — einfach beobachtet.';
    document.getElementById('kreis').textContent = '✓';
    document.getElementById('kreis').classList.remove('ein');
    document.getElementById('atemBtn').style.display = 'inline-block';
    document.getElementById('atemBtn').textContent = 'Nochmal';
    document.getElementById('atemBtn').onclick = () => { resetAtem(); };
    atemLaeuft = false;
    return;
  }

  atemZaehler++;
  document.getElementById('kreis').textContent = atemZaehler;
  document.getElementById('zaehltext').textContent = 'Einatmen...';
  document.getElementById('kreis').classList.add('ein');

  setTimeout(() => {
    document.getElementById('zaehltext').textContent = 'Ausatmen...';
    document.getElementById('kreis').classList.remove('ein');
    setTimeout(atemZyklus, 4000);
  }, 4000);
}
</script>

</body>
</html>
